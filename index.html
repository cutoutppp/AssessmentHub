<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AssessmentHub/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeacherHub Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/AssessmentHub/assets/index-ynmewE__.js"></script>
    <link rel="stylesheet" crossorigin href="/AssessmentHub/assets/index-CpDl0GpN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script to dynamically manage and inject cards in Teacher Hub under 'ระบบที่เกี่ยวข้อง'
      const observer = new MutationObserver((mutations) => {
        // Look for all grids
        const grids = document.querySelectorAll('.grid');
        
        let targetGrid = null;
        if (grids.length > 0) {
          targetGrid = grids[grids.length - 1];
        }

        if (targetGrid) {
          // 1. Remove duplicate placeholder 'แผนวัดผล' card (which says 'กำลังพัฒนา' and 'เร็วๆ นี้')
          const allCards = targetGrid.querySelectorAll('div, a');
          allCards.forEach((el) => {
            if (el.textContent && el.textContent.includes('แผนวัดผล') && el.textContent.includes('กำลังพัฒนา')) {
              el.remove();
            }
          });

          // 2. Inject active 'ระบบจัดทำแผนวัดผล (วผ.19)' card if not present
          if (!document.getElementById('assessment-plan-injected-card')) {
            const planCard = document.createElement('a');
            planCard.id = 'assessment-plan-injected-card';
            planCard.href = 'assessment-plan/index.html';
            planCard.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-indigo-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            planCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-200">ภาค 2/2569</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">ระบบจัดทำแผนวัดผล (วผ.19)</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">สร้างเอกสารแผนวัดผลอัตโนมัติ ตรงตามเกณฑ์ 50:50 และโครงสร้างหลักสูตร</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-indigo-600">
                <span>เข้าสู่ระบบ</span>
                <span>→</span>
              </div>
            `;
            targetGrid.appendChild(planCard);
          }

          // 3. Inject T2G Analyzer card if not present
          if (!document.getElementById('t2g-injected-card')) {
            const card = document.createElement('a');
            card.id = 't2g-injected-card';
            card.href = 'T2G_Analyzer/index.html';
            card.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-red-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            card.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-red-50 text-red-600 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-red-50 text-red-600 px-2 py-0.5 rounded-md border border-red-200">แอดมิน</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-red-600 transition-colors">ระบบวิเคราะห์ ต.2ก</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">ตรวจสอบเกรดผิดปกติและพฤติกรรม</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-red-600">
                <span>เข้าสู่ระบบ</span>
                <span>→</span>
              </div>
            `;
            targetGrid.appendChild(card);
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
