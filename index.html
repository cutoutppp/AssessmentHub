<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AssessmentHub/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeacherHub Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/AssessmentHub/assets/index-ynmewE__.js"></script>
    <link rel="stylesheet" crossorigin href="/AssessmentHub/assets/index-CpDl0GpN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script to dynamically inject the T2G Analyzer card into the Admin Dashboard
      const observer = new MutationObserver((mutations) => {
        // Look for the grid container in Admin Dashboard
        const grid = document.querySelector('.grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4.gap-6');
        if (grid && !document.getElementById('t2g-injected-card')) {
          const card = document.createElement('div');
          card.id = 't2g-injected-card';
          card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col justify-between cursor-pointer hover:shadow-md transition-shadow relative overflow-hidden group';
          card.onclick = () => window.location.href = 't2g_admin.html';
          
          card.innerHTML = `
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-400 to-rose-500"></div>
            <div class="flex items-start justify-between mb-2">
              <div class="text-slate-500 font-medium">ต.2ก Analyzer</div>
              <span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-red-100">NEW</span>
            </div>
            <div class="flex items-end gap-2 mt-2">
              <div class="text-2xl font-bold text-slate-800">วิเคราะห์ข้อมูล</div>
            </div>
            <div class="text-sm text-slate-400 mt-3 group-hover:text-red-500 transition-colors flex items-center gap-1">
              คลิกเพื่อเปิดระบบ 
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>
          `;
          
          grid.appendChild(card);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
