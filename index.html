<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AssessmentHub/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeacherHub Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/AssessmentHub/assets/index-ynmewE__.js"></script>
    <link rel="stylesheet" crossorigin href="/AssessmentHub/assets/index-CpDl0GpN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script to dynamically inject the T2G Analyzer card into the Teacher Hub or Admin Dashboard
      const observer = new MutationObserver((mutations) => {
        // Look for ANY main grid container in the page
        const grid = document.querySelector('.grid');
        if (grid && !document.getElementById('t2g-injected-card')) {
          const card = document.createElement('a'); // Make it an anchor tag directly
          card.id = 't2g-injected-card';
          card.href = 't2g_admin.html';
          // Mimic common card styling in this project
          card.className = 'bg-white rounded-3xl p-8 shadow-sm hover:shadow-md transition-all border border-slate-100 flex flex-col justify-between cursor-pointer group relative overflow-hidden text-left block';
          
          card.innerHTML = `
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-red-400 to-rose-500"></div>
            <div class="flex items-start justify-between mb-4">
              <div class="p-3 bg-red-50 text-red-600 rounded-2xl group-hover:bg-red-500 group-hover:text-white transition-colors">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              </div>
              <span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full">แอดมิน</span>
            </div>
            <div>
              <h3 class="text-xl font-bold text-slate-800 mb-2">ระบบวิเคราะห์ ต.2ก</h3>
              <p class="text-slate-500 text-sm">ตรวจสอบและไฮไลท์เกรดผิดปกติ</p>
            </div>
          `;
          
          grid.appendChild(card);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
