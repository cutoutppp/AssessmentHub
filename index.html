  <body>
    <div id="root"></div>
    <script>
      // Script to dynamically manage and inject cards in Teacher Hub under 'ระบบที่เกี่ยวข้อง'
      const observer = new MutationObserver((mutations) => {
        // Look for all grids
        const grids = document.querySelectorAll('.grid');
        
        let targetGrid = null;
        if (grids.length > 0) {
          targetGrid = grids[grids.length - 1];
        }

        if (targetGrid) {
          // 1. Remove duplicate placeholder 'แผนวัดผล' card (which says 'กำลังพัฒนา' and 'เร็วๆ นี้')
          const allCards = targetGrid.querySelectorAll('div, a');
          allCards.forEach((el) => {
            if (el.textContent && el.textContent.includes('แผนวัดผล') && el.textContent.includes('กำลังพัฒนา')) {
              el.remove();
            }
            if (el.id === 'exam-report-injected-card' || (el.textContent && (el.textContent.includes('รายงานผลประเมินการจัดสอบ') || el.textContent.includes('รายงานผลการประเมินความพึงพอใจการจัดสอบ')))) {
              el.remove();
            }
          });

          // 2. Inject active 'ระบบจัดทำแผนวัดผล (วผ.19)' card if not present
          if (!document.getElementById('assessment-plan-injected-card')) {
            const planCard = document.createElement('a');
            planCard.id = 'assessment-plan-injected-card';
            planCard.href = 'assessment-plan/index.html';
            planCard.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-indigo-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            planCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-200">ภาค 2/2569</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">ระบบจัดทำแผนวัดผล (วผ.19)</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">สร้างเอกสารแผนวัดผลอัตโนมัติ ตรงตามเกณฑ์ 50:50 และโครงสร้างหลักสูตร</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-indigo-600">
                <span>เข้าสู่ระบบ</span>
                <span>→</span>
              </div>
            `;
            targetGrid.appendChild(planCard);
          }

          // 2.5 Inject Thai Open Curriculum (CurriculumMD) card if not present
          if (!document.getElementById('curriculum-md-injected-card')) {
            const curCard = document.createElement('a');
            curCard.id = 'curriculum-md-injected-card';
            curCard.href = 'https://cutoutppp.github.io/CurriculumMD/';
            curCard.target = '_blank';
            curCard.rel = 'noopener noreferrer';
            curCard.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-teal-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            curCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center group-hover:bg-teal-600 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-teal-50 text-teal-700 px-2 py-0.5 rounded-md border border-teal-200">2,056 ตัวชี้วัด</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-teal-600 transition-colors">คลังตัวชี้วัด & สาระแกนกลาง</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">สืบค้นตัวชี้วัด 2,056 ข้อ สัดส่วนระหว่างทาง-ปลายทาง และตัวช่วยจัดทำแผนการสอน (สพฐ.)</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-teal-600">
                <span>เปิดระบบสืบค้น (CurriculumMD)</span>
                <span>↗</span>
              </div>
            `;
            targetGrid.appendChild(curCard);
          }

          // 3. Inject NextSGS Chrome Web Store extension card if not present
          if (!document.getElementById('nextsgs-extension-injected-card')) {
            const extCard = document.createElement('a');
            extCard.id = 'nextsgs-extension-injected-card';
            extCard.href = 'https://chromewebstore.google.com/detail/nextsgs-%E0%B8%9E%E0%B8%B1%E0%B8%92%E0%B8%99%E0%B8%B2%E0%B8%99%E0%B8%B4%E0%B8%84%E0%B8%A1-assessm/halnlgmkmmdmfggkaeekmhgicocafimc';
            extCard.target = '_blank';
            extCard.rel = 'noopener noreferrer';
            extCard.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-emerald-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            extCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md border border-emerald-200">Chrome Store</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-emerald-600 transition-colors">ส่วนขยาย NextSGS</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">หยอดคะแนน ปพ.5 สู่ SGS อัตโนมัติ (ติดตั้งง่ายเพียงกด "เพิ่มใน Chrome")</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-emerald-600">
                <span>ติดตั้งส่วนขยาย (คลิกเดียว)</span>
                <span>↗</span>
              </div>
            `;
            targetGrid.appendChild(extCard);
          }

          // 4. Inject T2G Analyzer card if not present
          if (!document.getElementById('t2g-injected-card')) {
            const card = document.createElement('a');
            card.id = 't2g-injected-card';
            card.href = 'T2G_Analyzer/index.html';
            card.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-red-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            card.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-red-50 text-red-600 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-red-50 text-red-600 px-2 py-0.5 rounded-md border border-red-200">แอดมิน</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-red-600 transition-colors">ระบบวิเคราะห์ ต.2ก</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">ตรวจสอบเกรดผิดปกติและพฤติกรรม</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-red-600">
                <span>เข้าสู่ระบบ</span>
                <span>→</span>
              </div>
            `;
            targetGrid.appendChild(card);
          }

          // 5. Inject Assessment Tool Survey card if not present
          if (!document.getElementById('tool-survey-injected-card')) {
            const surveyCard = document.createElement('a');
            surveyCard.id = 'tool-survey-injected-card';
            surveyCard.href = 'tool-survey.html';
            surveyCard.className = 'group bg-white rounded-xl p-3.5 border border-slate-200/80 hover:border-indigo-500/40 cursor-pointer shadow-xs hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 flex flex-col justify-between block text-left decoration-transparent';
            surveyCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                  </div>
                  <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-200">Firebase Live</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">แบบประเมินเครื่องมือวัดผล</h3>
                <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">ประเมินความพึงพอใจและการลดภาระงาน (วผ.19, NextSGS, ปพ.5) พร้อมผลสรุปสด</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-indigo-600">
                <span>เปิดแบบประเมิน</span>
                <span>→</span>
              </div>
            `;
            targetGrid.appendChild(surveyCard);
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // ================= Pop-up ร้องขอความเมตตาทำแบบประเมิน (Survey Nag Modal) =================
      function initSurveyNag() {
        const isDone = localStorage.getItem('assessment_tool_survey_done') === 'true';
        if (isDone) return;

        const overlay = document.getElementById('surveyNagOverlay');
        const pill = document.getElementById('surveyFloatingPill');
        const snoozedUntil = parseInt(sessionStorage.getItem('survey_nag_snoozed_until') || '0', 10);
        const now = Date.now();

        if (now > snoozedUntil) {
          setTimeout(() => {
            if (overlay) overlay.style.display = 'flex';
          }, 1200);
        } else {
          if (pill) pill.style.display = 'block';
        }
      }

      window.dismissSurveyNag = function(markDone) {
        const overlay = document.getElementById('surveyNagOverlay');
        const pill = document.getElementById('surveyFloatingPill');
        if (overlay) overlay.style.display = 'none';

        if (markDone) {
          localStorage.setItem('assessment_tool_survey_done', 'true');
          if (pill) pill.style.display = 'none';
        } else {
          sessionStorage.setItem('survey_nag_snoozed_until', (Date.now() + 15 * 60 * 1000).toString());
          if (pill) pill.style.display = 'block';
        }
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSurveyNag);
      } else {
        initSurveyNag();
      }
    </script>

    <!-- Modal HTML -->
    <div id="surveyNagOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(15,23,42,0.65); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); align-items:center; justify-content:center; padding:16px;">
      <div style="background:#ffffff; border-radius:24px; max-width:440px; width:100%; padding:28px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.3); border:1px solid #e0e7ff; position:relative; overflow:hidden; font-family:'Noto Sans Thai', sans-serif;">
        <!-- Top Gradient bar -->
        <div style="position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, #f59e0b, #ec4899, #6366f1);"></div>
        
        <!-- Badge & Close -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; margin-top:4px;">
          <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:9999px; font-size:11px; font-weight:700; background:#fef3c7; color:#b45309; border:1px solid #fde68a;">
            🥺 ขอรบกวนเวลาครูแค่ 1 นาทีครับ
          </span>
          <button onclick="dismissSurveyNag(false)" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='none'">
            ✕
          </button>
        </div>

        <!-- Headline -->
        <h3 style="font-size:18px; font-weight:800; color:#0f172a; line-height:1.4; margin:0 0 10px 0;">
          กราบเรียนคุณครูทุกท่าน... 🙏<br>
          <span style="color:#4f46e5;">ช่วยทำแบบประเมินเครื่องมือสักนิดนะครับ</span>
        </h3>
        <p style="font-size:13.5px; color:#475569; line-height:1.65; margin:0 0 20px 0;">
          ทีมนักพัฒนาและงานวัดผลกำลังรวบรวมข้อมูลเพื่อยืนยันการลดภาระงานครู ตอนนี้คนตอบยังน้อยมาก ๆ เลยครับ 😭
        </p>

        <!-- Buttons -->
        <div style="display:flex; flex-direction:column; gap:10px;">
          <a href="https://cutoutppp.github.io/AssessmentHub/tool-survey.html" target="_blank" onclick="dismissSurveyNag(true)" 
             style="display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg, #4f46e5, #4338ca); color:#ffffff; font-weight:700; font-size:14px; padding:12px 20px; border-radius:14px; text-decoration:none; box-shadow:0 4px 12px rgba(79,70,229,0.3); transition:transform 0.15s, box-shadow 0.15s;"
             onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 16px rgba(79,70,229,0.4)'"
             onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(79,70,229,0.3)'">
            <span>🚀 ช่วยทำแบบประเมิน (1 นาที)</span>
          </a>
          
          <div style="display:flex; align-items:center; justify-content:space-between; padding:0 4px;">
            <button onclick="dismissSurveyNag(false)" style="background:none; border:none; color:#64748b; font-size:12px; cursor:pointer; padding:6px; text-decoration:underline; font-family:inherit;">
              ขอทำงานก่อนนะ (เดี๋ยวแวะมา)
            </button>
            <button onclick="dismissSurveyNag(true)" style="background:none; border:none; color:#4f46e5; font-size:12px; font-weight:600; cursor:pointer; padding:6px; font-family:inherit;">
              ทำไปเรียบร้อยแล้วจ้า ✓
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Pill Button -->
    <div id="surveyFloatingPill" style="display:none; position:fixed; bottom:20px; right:20px; z-index:99990; font-family:'Noto Sans Thai', sans-serif;">
      <a href="https://cutoutppp.github.io/AssessmentHub/tool-survey.html" target="_blank"

        <span>ครูอย่าลืมแวะทำแบบประเมินนะ (1 นาที)</span>
        <span style="background:rgba(255,255,255,0.25); padding:2px 6px; border-radius:9999px; font-size:10px;">→</span>
      </a>
    </div>
