<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบสร้างใบปะหน้าซองข้อสอบ (พร้อม QR Code)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary: #2563EB; --surface: #ffffff; --bg: #F3F4F6; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #111827; margin-bottom: 30px; font-size: 26px; font-weight: 600; }
        .search-box { width: 100%; padding: 12px 15px; border: 2px solid #E5E7EB; border-radius: 8px; font-size: 16px; font-family: 'Sarabun', sans-serif; box-sizing: border-box; transition: border-color 0.2s; }
        .search-box:focus { border-color: var(--primary); outline: none; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 14px; font-family: 'Sarabun', sans-serif; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #E5E7EB; text-align: left; vertical-align: middle; }
        th { background: #F9FAFB; font-weight: 600; color: #4B5563; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 0 #E5E7EB; }
        tr:hover td { background: #F3F4F6; }
        
        .btn-print { display: block; width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 30px; transition: background 0.2s; }
        .btn-print:hover { background-color: #1D4ED8; }
        .btn-print:disabled { background-color: #9CA3AF; cursor: not-allowed; }
        .icon { vertical-align: middle; margin-right: 8px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 13px; font-weight: 600; }
        .badge-blue { background: #DBEAFE; color: #1E40AF; }
        .badge-green { background: #D1FAE5; color: #065F46; }

        .table-container { max-height: 600px; overflow-y: auto; border: 1px solid #E5E7EB; border-radius: 8px; }
        
        .controls-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .controls-row > div.flex-2 { flex: 2; min-width: 300px; }
        .controls-row > div.flex-1 { flex: 1; min-width: 200px; }

        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
        
        /* Custom scrollbar */
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 8px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ระบบสร้างใบปะหน้าซองข้อสอบ <span style="font-size: 18px; color: #10B981;">(ค้นหาและพิมพ์หลายรายการ)</span></h1>
        
        <div class="controls-row">
            <div class="flex-2">
                <label>ค้นหารายการ (ชื่อวิชา, รหัสวิชา, ชื่อครูผู้สอน, ชั้น/ห้อง)</label>
                <input type="text" id="searchInput" class="search-box" placeholder="พิมพ์คำค้นหาที่นี่..." onkeyup="filterTable()">
            </div>
            <div class="flex-1">
                <label>เบอร์โทรศัพท์ส่วนกลาง</label>
                <input type="text" id="globalPhone" placeholder="เช่น 081-234-5678" oninput="updateAllPhones()">
            </div>
        </div>

        <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #F9FAFB; padding: 15px; border-radius: 8px; border: 1px solid #E5E7EB;">
            <div style="font-size: 16px; font-weight: 600; color: #4B5563;">
                พบ <span id="resultCount" style="color: var(--primary); font-size: 18px;">0</span> รายการ
            </div>
            <div style="font-size: 16px; font-weight: 600; color: #4B5563;">
                เลือกไว้ <span id="selectedCount" style="color: #10B981; font-size: 18px;">0</span> รายการ
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">
                            <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" title="เลือกทั้งหมด">
                        </th>
                        <th style="width: 100px;">ชั้น/ห้อง</th>
                        <th>วิชา</th>
                        <th>ผู้สอน</th>
                        <th>วัน/เวลาสอบ</th>
                        <th style="width: 100px;">จำนวนข้อสอบ (ชุด)</th>
                        <th style="width: 150px;">เบอร์โทรผู้สอน</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be rendered here -->
                </tbody>
            </table>
        </div>

        <button id="printBtn" class="btn-print" onclick="exportToWord()" disabled>
            <i class="material-icons-round icon">print</i> ดาวน์โหลดใบปะหน้า (Word)
        </button>
    </div>

                const subjHtml = `<div><b style="font-size:15px; color:#1F2937;">${item.subj_name}</b></div><div style="color:#6B7280; font-size:13px; margin-top:4px;">รหัส: ${item.subj_code}</div>`;
                const dateHtml = `<div>${item.date_d} ${item.date_m} ${item.date_y}</div><div style="color:#6B7280; font-size:13px; margin-top:4px;"><i class="material-icons-round" style="font-size:14px; vertical-align:middle;">schedule</i> ${item.time}</div>`;
                
                const countVal = rowInputs[item.id].count;
                const phoneVal = rowInputs[item.id].phone || gPhone; // fallback to global phone

                html += `
                    <tr>
                        <td style="text-align: center;">
                            <input type="checkbox" class="row-checkbox" value="${item.id}" ${isSelected} onchange="toggleRow('${item.id}', this.checked)">
                        </td>
                        <td><span class="badge badge-blue">${item.class_name}</span></td>
                        <td>${subjHtml}</td>
                        <td>
                            <div style="font-weight:600; color:#374151;">${item.teacher_name || '-'}</div>
                        </td>
                        <td>${dateHtml}</td>
                        <td>
                            <input type="number" placeholder="จำนวน" value="${countVal}" oninput="updateRowInput('${item.id}', 'count', this.value)" style="text-align:center;">
                        </td>
                        <td>
                            <input type="text" placeholder="เบอร์โทร" value="${phoneVal}" oninput="updateRowInput('${item.id}', 'phone', this.value)">
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            updateSelectAllCheckbox();
        }

        function updateRowInput(id, field, value) {
            if (rowInputs[id]) {
                rowInputs[id][field] = value;
            }
        }

        function updateAllPhones() {
            renderTable(); // Re-render table to propagate global phone where local phone is empty
        }

        function toggleRow(id, isChecked) {
            if (isChecked) selectedIds.add(id);
            else selectedIds.delete(id);
            updateCounts();
            updateSelectAllCheckbox();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            filteredData.forEach(item => {
                if (selectAll) selectedIds.add(item.id);
                else selectedIds.delete(item.id);
            });
            renderTable(); // Update checkboxes in UI
            updateCounts();
        }

        function updateSelectAllCheckbox() {
            const selectAll = document.getElementById('selectAll');
            if (filteredData.length === 0) {
                selectAll.checked = false;
                return;
            }
            const allSelected = filteredData.every(item => selectedIds.has(item.id));
            selectAll.checked = allSelected;
        }

        function updateCounts() {
            document.getElementById('resultCount').innerText = filteredData.length;
            document.getElementById('selectedCount').innerText = selectedIds.size;
            
            const btn = document.getElementById('printBtn');
            btn.disabled = selectedIds.size === 0;
            if (selectedIds.size > 0) {
                btn.innerHTML = `<i class="material-icons-round icon">print</i> ดาวน์โหลดใบปะหน้า จำนวน ${selectedIds.size} รายการ`;
            } else {
                btn.innerHTML = `<i class="material-icons-round icon">print</i> ดาวน์โหลดใบปะหน้า (กรุณาเลือกรายการ)`;
            }
        }

        function exportToWord() {
            if (selectedIds.size === 0) return;
            
            // Get selected items ordered as they appear in the original DB
            const itemsToPrint = db.filter(item => selectedIds.has(item.id));
            const gPhone = document.getElementById('globalPhone').value;
            
            let content = '<table style="width: 100%; border-collapse: collapse; border: none; margin: 0; padding: 0;">';
            
            // Print 2 columns per row
            for (let i = 0; i < itemsToPrint.length; i += 2) {
                content += '<tr>';
                for (let j = 0; j < 2; j++) {
                    let idx = i + j;
                    content += '<td style="width: 50%; border: 1px solid black; padding: 0.3cm 0.5cm; vertical-align: top;">';
                    
                    if (idx < itemsToPrint.length) {
                        const cls = itemsToPrint[idx];
                        
                        const countText = rowInputs[cls.id].count ? rowInputs[cls.id].count : '........................';
                        const phoneText = rowInputs[cls.id].phone ? rowInputs[cls.id].phone : (gPhone || '..................................................');
                        
                        const invigText = cls.invigilator_name ? cls.invigilator_name : '........................................................';
                        const teacherText = cls.teacher_name ? cls.teacher_name : '........................................................';
                        
                        const bldg = cls.building ? cls.building : '........';
                        const room = cls.room ? cls.room : '...................';
                        const subjCode = cls.subj_code ? cls.subj_code : '...................';
                        const subjName = cls.subj_name ? cls.subj_name : '.......................................';
                        const gradeLvl = cls.grade_lvl ? cls.grade_lvl : '.......';
                        const classNum = cls.class_num ? cls.class_num : '.......';
                        const d = cls.date_d ? cls.date_d : '.......';
                        const m = cls.date_m ? cls.date_m : '............';
                        const y = cls.date_y ? cls.date_y : '..........';
                        const time = cls.time ? cls.time : '...................';

                        const classCode = (cls.grade_lvl || 'X') + (cls.class_num ? cls.class_num.replace(/[^0-9]/g, '') : 'X');
                        const trackingId = `${termYear}-${classCode}-${cls.subj_code || 'XXXXX'}`;
                        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${trackingId}`;

                        content += `
                            <table style="width: 100%; border: none; margin-bottom: 6pt; border-collapse: collapse;">
                                <tr>
                                    <td style="border: none; text-align: left; vertical-align: middle; padding: 0;">
                                        <div style="font-size: 18pt; font-weight: bold;">โรงเรียนพัฒนานิคม จังหวัดลพบุรี</div>
                                    </td>
                                    <td style="border: none; text-align: right; vertical-align: top; width: 80px; padding: 0;">
                                        <img src="${qrUrl}" width="65" height="65" alt="QR" />
                                        <div style="font-size: 9pt; margin-top: 2pt;">${trackingId}</div>
                                    </td>
                                </tr>
                            </table>
                            <div style="text-align: center; font-size: 16pt; margin-bottom: 4pt;">อาคาร &nbsp;&nbsp;${bldg}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">ห้องสอบ &nbsp;&nbsp;${room}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">รหัสวิชา &nbsp;&nbsp;${subjCode}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">วิชา &nbsp;&nbsp;${subjName}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">ชั้นมัธยมศึกษาปีที่ &nbsp;&nbsp;${gradeLvl}&nbsp;&nbsp; / &nbsp;&nbsp;${classNum}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">จำนวนข้อสอบ &nbsp;&nbsp;${countText}&nbsp;&nbsp; ชุด</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">วันที่สอบ &nbsp;&nbsp;${d}&nbsp;&nbsp; / &nbsp;&nbsp;${m}&nbsp;&nbsp; / &nbsp;&nbsp;${y}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">เวลาสอบ &nbsp;&nbsp;${time}&nbsp;&nbsp; น.</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">กรรมการคุมสอบ &nbsp;&nbsp;${invigText}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt;">ผู้สอน &nbsp;&nbsp;${teacherText}</div>
                            <div style="font-size: 16pt; margin-bottom: 0;">เบอร์โทรผู้สอน &nbsp;&nbsp;${phoneText}</div>
                        `;
                    }
                    content += '</td>';
                }
                content += '</tr>';
                
                // Add page break after every 2 rows (4 covers per page)
                if (i + 2 < itemsToPrint.length) {
                    content += "<br clear=all style='mso-special-character:line-break;page-break-before:always'>";
                }
            }
            content += '</table>';

            const htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Export Word</title>
                    <style>
                        body, table, td, div { font-family: 'TH SarabunPSK', 'TH Sarabun New', 'Sarabun', sans-serif; line-height: 1.0; }
                        @page WordSection1 { size: 21.0cm 29.7cm; margin: 1.0cm; }
                        div.WordSection1 { page: WordSection1; }
                    </style>
                </head>
                <body>
                    <div class="WordSection1">
                        ${content}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['﻿' + htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `ใบปะหน้าซองข้อสอบ_${itemsToPrint.length}รายการ.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
