                    fontFamily: {

    <style>
        body { background-color: #F8FAFC; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-panel {
            background: rgba(255, 255, 255, 1);
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .table-container {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        /* Table sticky header */
        th {
            position: sticky;
            top: 0;
            background: #F8FAFC;
            z-index: 10;
        }
        th::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            border-bottom: 1px solid #E2E8F0;
        }

        /* Checkbox styling */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #CBD5E1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #4F46E5;
            border-color: #4F46E5;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .animated-row {
            transition: all 0.2s;
        }
        .animated-row:hover {
            background-color: #F1F5F9;
        }
        .animated-row.selected {
            background-color: #EEF2FF;
        }

        /* Inputs within table */
        .table-input {
            width: 100%;
            padding: 0.375rem 0.75rem;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            background-color: transparent;
            transition: all 0.2s;
            font-family: 'Sarabun', sans-serif;
        }
        .table-input:hover {
            border-color: #CBD5E1;
            background-color: #FFFFFF;
        }
        .table-input:focus {
            outline: none;
            border-color: #4F46E5;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }
    </style>

<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Header -->

            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="ri-printer-cloud-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-wide text-slate-900">ระบบปริ๊นใบปะหน้าซองข้อสอบ</h1>
                    <p class="text-xs text-emerald-600 font-medium">ฝัง QR Code อัตโนมัติ (ภาคเรียนที่ 1/2569)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-2 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                    <i class="ri-phone-line text-slate-400"></i>
                    <input type="text" id="globalPhone" placeholder="เบอร์โทรส่วนกลาง..." 
                           class="bg-transparent border-none focus:outline-none text-sm w-40 font-sarabun"

                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">

        <div class="glass-panel rounded-2xl p-5 mb-5 flex-none flex flex-col gap-4">
            
            <div class="flex gap-4 items-center">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">

                        <i class="ri-close-circle-fill text-lg"></i>
                    </button>
                </div>

                            <option value="ม.5">ม.5</option>
                            <option value="ม.6">ม.6</option>

                            <i class="ri-arrow-down-s-line text-slate-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats & Quick Actions -->
            <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-1">

                    <div class="flex items-center gap-2 text-slate-600">
                        <i class="ri-file-list-3-line text-slate-400"></i>

                    </div>
                    <div class="flex items-center gap-2 text-indigo-600 font-medium">
                        <i class="ri-checkbox-multiple-line"></i> 
                        <span>เลือกไว้ <strong id="selectedCount" class="text-lg">0</strong> รายการ</span>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    
                    <button onclick="toggleShowSelected()" id="showSelectedBtn" class="px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors flex items-center gap-2 hidden">
                        <i class="ri-eye-line"></i> ดูที่เลือกไว้

                    <button onclick="clearSelection()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center gap-2">
                        <i class="ri-eraser-line"></i> ล้างการเลือก
                    </button>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="glass-panel rounded-2xl flex-1 flex flex-col min-h-0 overflow-hidden shadow-sm">
            <div class="table-container flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="py-4 px-4 w-12 text-center">

                            </th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-24">ชั้น/ห้อง</th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider">วิชาที่สอบ</th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider">ครูผู้สอน</th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">วันและเวลาสอบ</th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-28 text-center">จำนวนชุด</th>
                            <th class="py-4 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">เบอร์ติดต่อ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Content dynamically generated -->
                    </tbody>
                </table>
            </div>
            
            <!-- Sticky Footer Print Area -->
            <div class="bg-white border-t border-slate-200 p-4 flex justify-between items-center z-10 flex-none rounded-b-2xl">

                    <i class="ri-information-fill text-indigo-400 text-lg"></i>

                </div>
                <button id="printBtn" onclick="exportToWord()" disabled
                        class="flex items-center gap-2 px-8 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white text-base font-medium rounded-xl shadow-sm hover:shadow-md transition-all transform active:scale-95 disabled:active:scale-100">

                    <span id="printBtnText">ดาวน์โหลดไฟล์ Word</span>
                </button>
            </div>
        </div>
    </main>

                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">รหัสวิชา &nbsp;&nbsp;${subjCode}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">วิชา &nbsp;&nbsp;${subjName}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">ชั้นมัธยมศึกษาปีที่ &nbsp;&nbsp;${gradeLvl}&nbsp;&nbsp; / &nbsp;&nbsp;${classNum}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">จำนวนข้อสอบ &nbsp;&nbsp;${countText}&nbsp;&nbsp; ชุด</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">วันที่สอบ &nbsp;&nbsp;${d}&nbsp;&nbsp; / &nbsp;&nbsp;${m}&nbsp;&nbsp; / &nbsp;&nbsp;${y}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">เวลาสอบ &nbsp;&nbsp;${time}&nbsp;&nbsp; น.</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">กรรมการคุมสอบ &nbsp;&nbsp;${invigText}</div>
                            <div style="font-size: 16pt; margin-bottom: 4pt; font-family: 'TH SarabunPSK';">ผู้สอน &nbsp;&nbsp;${teacherText}</div>
                            <div style="font-size: 16pt; margin-bottom: 0; font-family: 'TH SarabunPSK';">เบอร์โทรผู้สอน &nbsp;&nbsp;${phoneText}</div>
                        `;
                    }
                    content += '</td>';
                }
                content += '</tr>';
                
                if (i + 2 < itemsToPrint.length) {
                    content += "<br clear=all style='mso-special-character:line-break;page-break-before:always'>";
                }
            }
            content += '</table>';

            const htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Export Word</title>
                    <style>
                        body, table, td, div { font-family: 'TH SarabunPSK', 'TH Sarabun New', 'Sarabun', sans-serif; line-height: 1.0; }
                        @page WordSection1 { size: 21.0cm 29.7cm; margin: 1.0cm; }
                        div.WordSection1 { page: WordSection1; }
                    </style>
                </head>
                <body>
                    <div class="WordSection1">
                        ${content}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['﻿' + htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `ใบปะหน้าซองข้อสอบ_${itemsToPrint.length}รายการ.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = init;
    </script>
</body>
</html>
